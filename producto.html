  .container{max-width:1200px;margin:20px auto;padding:16px}

  .layout{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}

  /* GALLERY */
  .gallery{flex:1 1 510px;min-width:280px;background:var(--card);border-radius:12px;padding:12px;overflow:hidden}
  .carousel-viewport{width:100%;overflow:hidden;border-radius:10px;position:relative}
  .carousel-track{display:flex;transition:transform .35s ease;will-change:transform}
  .carousel-slide{width:100%;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0}
  .carousel-slide img{
  width:100%;
  height:420px;
  max-height:65vh;
  object-fit:contain;   /* Mostramos la imagen completa sin recortar */
  background-color:#111; /* relleno elegante y neutro */
  border-radius:10px;
  user-select:none;
  cursor:zoom-in;
  pointer-events:auto;
}

  .color-swatch{width:28px;height:28px;border-radius:6px;display:inline-block;vertical-align:middle}
  .buy-row{display:flex;gap:10px;margin-top:14px;align-items:center}
  .btn-buy{background:var(--accent);border:0;padding:12px 16px;border-radius:10px;color:#000;font-weight:700;cursor:pointer}
  .btn-video{background:transparent;border:1px solid var(--accent);padding:10px 12px;border-radius:10px;color:var(--accent);cursor:pointer}
  .note{font-size:13px;color:var(--muted);margin-top:8px}

  .overlay.active{display:flex}
  .overlay.blur{backdrop-filter:blur(6px);background:rgba(0,0,0,0.45)}
  .modal{background:#121212;padding:22px;border-radius:14px;width:92%;max-width:480px;position:relative;box-shadow:0 8px 30px rgba(0,0,0,0.6)}
  .modal .close{position:absolute;right:10px;top:8px;background:transparent;border:0;color:#fff;font-size:20px;cursor:pointer}

// FUNCIÓN CORRECTA
// ==========================
function showSuccessAndSendReceipt(){
  // Disminuye stock local
  const currentStock = getStockFor(state.color, state.size);
  if(currentStock > 0){
    productData.stockByColorSize[state.color][state.size] = currentStock - 1;
  }
  updateStockAndAvailability();

  // Datos de compra
  const purchase = {
    product: productData.name,
    color: state.color,
    size: state.size,
    price: productData.basePrice,
    date: new Date().toLocaleString('es-AR'),
    whatsapp: productData.phoneWhats
  };

  // Guardar venta en localStorage
  const sales = JSON.parse(localStorage.getItem('sales') || '[]');
  sales.push(purchase);
  localStorage.setItem('sales', JSON.stringify(sales));

  // Generar PDF con jsPDF
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  
  doc.setFontSize(18);
  doc.text("Comprobante de Compra", 20, 20);
  doc.setFontSize(12);
  doc.text(`Producto: ${purchase.product}`, 20, 40);
  doc.text(`Color: ${purchase.color}`, 20, 50);
  doc.text(`Talle: ${purchase.size}`, 20, 60);
  doc.text(`Precio: $${purchase.price.toLocaleString('es-AR')}`, 20, 70);
  doc.text(`Fecha: ${purchase.date}`, 20, 80);

  // Descargar PDF
  doc.save(`Comprobante-${purchase.product}.pdf`);

  // Enviar por WhatsApp
  const waText =
    `Hola! Te envío mi comprobante de compra:\n\n` +
    `🛒 *${purchase.product}*\n` +
    `🎨 Color: ${purchase.color}\n` +
    `📏 Talle: ${purchase.size}\n` +
    `💵 Precio: $${purchase.price.toLocaleString('es-AR')}\n` +
    `📅 Fecha: ${purchase.date}\n\n` +
    `Adjunté PDF del comprobante.`;

  window.open(`https://wa.me/${purchase.whatsapp}?text=${encodeURIComponent(waText)}`, '_blank');

  alert("Pago simulado exitoso. Comprobante generado y enviado por WhatsApp.");
}


</script>

    // ======= MODAL IMAGEN FULLSCREEN =======
(function(){
  const imageOverlay = document.getElementById('imageOverlay');
  const fullImageView = document.getElementById('fullImageView');
  const closeImageModal = document.getElementById('closeImageModal');

  // Abrir al hacer clic en imagen del carrusel
  track.addEventListener('click', (e)=>{
    const img = e.target.closest('img');
    if(!img) return;
    const imgs = productData.images[state.color] || [];
    let idx = imgs.findIndex(s => s === img.src);
    if(idx === -1) idx = state.index || 0;
    state.index = idx;
    fullImageView.src = imgs[state.index];
    imageOverlay.classList.add('active');
    imageOverlay.setAttribute('aria-hidden','false');
  });

  // Cerrar modal
  closeImageModal.addEventListener('click', closeImageView);
  imageOverlay.addEventListener('click', (e)=>{ 
    if(e.target === imageOverlay) closeImageView(); 
  });
  function closeImageView(){
    imageOverlay.classList.remove('active');
    imageOverlay.setAttribute('aria-hidden','true');
  }

  // Swipe dentro del modal
  // ======= SWIPE FULLSCREEN IMAGES (TOUCH + MOUSE) =======
let startX = 0, isDragging = false, movedX = 0;

fullImageView.addEventListener('touchstart', handleStart, { passive: true });
fullImageView.addEventListener('touchmove', handleMove, { passive: false });
fullImageView.addEventListener('touchend', handleEnd);

fullImageView.addEventListener('mousedown', handleStart);
fullImageView.addEventListener('mousemove', handleMove);
fullImageView.addEventListener('mouseup', handleEnd);

function handleStart(e){
  isDragging = true;
  startX = e.touches ? e.touches[0].clientX : e.clientX;
}

function handleMove(e){
  if(!isDragging) return;
  movedX = (e.touches ? e.touches[0].clientX : e.clientX) - startX;
  
  // mover la imagen visualmente mientras se arrastra
  fullImageView.style.transform = `translateX(${movedX}px)`;
  fullImageView.style.transition = 'none';

  if(e.cancelable) e.preventDefault(); // permite movimiento suave sin scroll
}

function handleEnd(){
  if(!isDragging) return;
  isDragging = false;

  fullImageView.style.transition = 'transform .25s ease';

  const imgs = productData.images[state.color] || [];

  if(movedX < -80){
    // siguiente imagen
    state.index = (state.index + 1) % imgs.length;
  } else if(movedX > 80){
    // imagen anterior
    state.index = (state.index - 1 + imgs.length) % imgs.length;
  }

  fullImageView.src = imgs[state.index];
  fullImageView.style.transform = 'translateX(0)';
  movedX = 0;
}

  
  fullImageView.addEventListener('touchstart', startSwipe, {passive:true});
  fullImageView.addEventListener('touchmove', moveSwipe, {passive:false});
  fullImageView.addEventListener('touchend', endSwipe);
  fullImageView.addEventListener('mousedown', startSwipe);
  fullImageView.addEventListener('mousemove', moveSwipe);
  fullImageView.addEventListener('mouseup', endSwipe);
})();

  </script>

/* Render talles automáticamente según stockByColorSize keys (tomamos los talles más comunes) */

const talles = Object.keys(productData.stockByColorSize[sampleColor] || {'37':0,'38':0,'39':0,'40':0,'41':0});
talles.forEach(t=>{
  const b = document.createElement('button');

  b.dataset.size = t;

/* Render colores */
Object.keys(productData.images).forEach(c=>{
  const btn = document.createElement('button');
  btn.className = 'color-btn';

  btn.title = c;

/* ===========================
   Carousel build + controls
   ============================ */
function buildCarousel(color){
  track.innerHTML = '';
  dots.innerHTML = '';
  const imgs = productData.images[color] || [];
  imgs.forEach((src,i)=>{
    const slide = document.createElement('div');
    slide.className = 'carousel-slide';
    slide.innerHTML = `<img src="${src}" alt="${productData.name} - ${color} - ${i+1}">`;
    track.appendChild(slide);

    const dot = document.createElement('div');
    dot.className = 'dot' + (i===0? ' active' : '');
    dot.dataset.index = i;
    dot.addEventListener('click', ()=>goTo(i));
    dots.appendChild(dot);
  });
  state.index = Math.min(state.index, Math.max(0, imgs.length-1));
  updateCarousel();
}
function updateCarousel(){
  track.style.transform = `translateX(-${state.index * 100}%)`;
  Array.from(dots.children).forEach((d, idx) => d.classList.toggle('active', idx===state.index));
}
function goTo(i){
  state.index = i;
  updateCarousel();
}

/* swipe support (mobile + desktop) */
(function enableSwipe(){
  const viewport = document.getElementById('viewport');
  let startX=0, currentX=0, dragging=false, width=viewport.clientWidth;
  function unify(e){ return e.changedTouches ? e.changedTouches[0] : e; }
  viewport.addEventListener('touchstart', start, {passive:true});
  viewport.addEventListener('mousedown', start);
  viewport.addEventListener('touchmove', move, {passive:false});
  viewport.addEventListener('mousemove', move);
  viewport.addEventListener('touchend', end);
  viewport.addEventListener('mouseup', end);
  viewport.addEventListener('mouseleave', end);
  window.addEventListener('resize', ()=> width = viewport.clientWidth);

  function start(e){ const ev = unify(e); dragging=true; startX = ev.clientX; currentX = startX; track.style.transition = 'none'; }
  function move(e){ if(!dragging) return; const ev = unify(e); currentX = ev.clientX; const dx = currentX - startX; const percent = dx / width * 100; const base = -state.index * 100; track.style.transform = `translateX(${base + percent}%)`; e.preventDefault && e.preventDefault(); }
  function end(e){ if(!dragging) return; dragging=false; track.style.transition = ''; const dx = currentX - startX; const threshold = Math.max(20, width * 0.12); if(dx > threshold){ state.index = Math.max(0, state.index - 1); } else if(dx < -threshold){ state.index = Math.min((track.children.length || 1) - 1, state.index + 1); } updateCarousel(); }
})();

/* build initial carousel */
buildCarousel(state.color);
setVideoSourceForColor(state.color);

/* ===========================
   Stock y disponibilidad (por color + talle)
   ============================ */
function getStockFor(color, size){
  const byColor = productData.stockByColorSize[color] || {};
  return Number(byColor[size] || 0);
}
function updateStockAndAvailability(){
  const stock = getStockFor(state.color, state.size);
  stockCountEl.textContent = stock;
  if(stock > 0){
    stockNoteEl.textContent = 'En stock';
    stockNoteEl.style.color = '#9ff59a';
    document.getElementById('buyBtn').disabled = false;
    document.getElementById('buyBtn').style.opacity = '1';
  } else {
    stockNoteEl.textContent = 'Sin stock para ese color/talle';
    stockNoteEl.style.color = '#ff9a9a';
    document.getElementById('buyBtn').disabled = true;
    document.getElementById('buyBtn').style.opacity = '0.6';
  }
}
/* init stock */
updateStockAndAvailability();

/* ===========================
   Video modal logic
   ============================ */
function setVideoSourceForColor(color){
  const url = productData.videos[color] || '';

}
openVideoBtn.addEventListener('click', ()=>{

});
document.getElementById('closeVideo').addEventListener('click', closeVideoModal);

   ============================ */

/* =================================
   Payment modal & simulated flow
   ================================= */
const buyBtn = document.getElementById('buyBtn');
const payOverlay = document.getElementById('payOverlay');
const closePay = document.getElementById('closePay');
const confirmPay = document.getElementById('confirmPay');
const modalTotal = document.getElementById('modalTotal');
const cardType = document.getElementById('cardType');
const installments = document.getElementById('installments');

const selectedThumb = document.getElementById('selectedThumb');
const payProductName = document.getElementById('payProductName');
const payColor = document.getElementById('payColor');
const paySize = document.getElementById('paySize');
const payPrice = document.getElementById('payPrice');

const cuotasByCard = { debit:[1], visa:[1,3,6,12], master:[1,3,6], amex:[1,3,12] };

function populateInstallments(){
  const arr = cuotasByCard[cardType.value] || [1];
  installments.innerHTML = '';
  arr.forEach(q=>{
    const opt = document.createElement('option');
    opt.value = q;
    const per = Math.round(productData.basePrice / q);
    opt.text = `${q} x $${per.toLocaleString('es-AR')}`;
    installments.appendChild(opt);
  });
}

buyBtn.addEventListener('click', ()=>{
  // check stock before opening
  const stock = getStockFor(state.color, state.size);
  if(stock <= 0){
    alert('No hay stock para ese color y talle. Elegí otra combinación.');
    return;
  }

  payOverlay.classList.add('active');
  payOverlay.setAttribute('aria-hidden','false');

  selectedThumb.src = (productData.images[state.color] && productData.images[state.color][0]) || '';
  payProductName.textContent = productData.name;
  payColor.textContent = state.color.toUpperCase();
  paySize.textContent = state.size;
  // display price with discount if any
  if(productData.oldPrice && productData.oldPrice > productData.basePrice){
    payPrice.textContent = '$' + productData.basePrice.toLocaleString('es-AR') + ' ';
    modalTotal.textContent = 'Total: $' + productData.basePrice.toLocaleString('es-AR');
  } else {
    payPrice.textContent = '$' + productData.basePrice.toLocaleString('es-AR');
    modalTotal.textContent = 'Total: $' + productData.basePrice.toLocaleString('es-AR');
  }
  populateInstallments();
});

function showSuccessAndSendReceipt(){
confirmPay.addEventListener('click', async () => {
  confirmPay.disabled = true;
  confirmPay.textContent = "Procesando...";

  // Si el usuario eligió Mercado Pago, generamos el pago real
  const method = document.querySelector('input[name="paymethod"]:checked').value;

  if(method === "mercadopago"){
    // ⚠ Necesitas tener un backend real para que funcione
    try {
      const response = await fetch("http://localhost:3000/create_preference", {  // tu servidor
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title: productData.name,
          quantity: 1,
          unit_price: productData.basePrice,
        }),
      });

      const data = await response.json();
      if(data.id){
        // Crea Wallet Brick
        mp.bricks().create("wallet", "wallet_container", {
          initialization: { preferenceId: data.id }
        });
      }
    } catch (e) {
      alert("⚠ Error generando el pago. Necesitas servidor backend real.");
    }
  }

  // Simulación de pago con tarjeta o efectivo (local)
  setTimeout(()=>{
    confirmPay.disabled = false;
    confirmPay.textContent = 'Pagar ahora';
    payOverlay.classList.remove('active');
    showSuccessAndSendReceipt();
  }, 1500);
});


// ==========================
// FUNCIÓN CORRECTA
// ==========================
function showSuccessAndSendReceipt(){
  // Disminuye stock local
  const currentStock = getStockFor(state.color, state.size);
  if(currentStock > 0){
    productData.stockByColorSize[state.color][state.size] = currentStock - 1;
  }
  updateStockAndAvailability();

  // Datos de compra
  const purchase = {
    product: productData.name,
    color: state.color,
    size: state.size,
    price: productData.basePrice,
    date: new Date().toLocaleString('es-AR'),
    whatsapp: productData.phoneWhats
  };

  // Guardar venta en localStorage
  const sales = JSON.parse(localStorage.getItem('sales') || '[]');
  sales.push(purchase);
  localStorage.setItem('sales', JSON.stringify(sales));

  // Generar PDF con jsPDF
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  
  doc.setFontSize(18);
  doc.text("Comprobante de Compra", 20, 20);
  doc.setFontSize(12);
  doc.text(`Producto: ${purchase.product}`, 20, 40);
  doc.text(`Color: ${purchase.color}`, 20, 50);
  doc.text(`Talle: ${purchase.size}`, 20, 60);
  doc.text(`Precio: $${purchase.price.toLocaleString('es-AR')}`, 20, 70);
  doc.text(`Fecha: ${purchase.date}`, 20, 80);

  // Descargar PDF
  doc.save(`Comprobante-${purchase.product}.pdf`);

  // Enviar por WhatsApp
  const waText =
    `Hola! Te envío mi comprobante de compra:\n\n` +
    `🛒 *${purchase.product}*\n` +
    `🎨 Color: ${purchase.color}\n` +
    `📏 Talle: ${purchase.size}\n` +
    `💵 Precio: $${purchase.price.toLocaleString('es-AR')}\n` +
    `📅 Fecha: ${purchase.date}\n\n` +
    `Adjunté PDF del comprobante.`;

  window.open(`https://wa.me/${purchase.whatsapp}?text=${encodeURIComponent(waText)}`, '_blank');

  alert("Pago simulado exitoso. Comprobante generado y enviado por WhatsApp.");
}


}

/* ===========================
   Permitir preselección via URL
   Ej: index.html?color=red&size=39
   ============================ */
(function applyQueryParams(){
  const params = new URLSearchParams(location.search);
  const color = params.get('color');
  const size = params.get('size');
  if(color && productData.images[color]){
    state.color = color;
    const btn = colorsList.querySelector('.color-btn[data-color="'+color+'"]');
    if(btn){ document.querySelectorAll('.color-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
    buildCarousel(color);
    setVideoSourceForColor(color);
  }
  if(size){
    state.size = size;
    const sb = sizesList.querySelector('.size-btn[data-size="'+size+'"]');
    if(sb){ document.querySelectorAll('.size-btn').forEach(b=>b.classList.remove('active')); sb.classList.add('active'); }
  }
  updateStockAndAvailability();
})();
