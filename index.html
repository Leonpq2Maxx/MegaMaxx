<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MovieTx TV Optimizado</title>

<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;overflow-x:hidden;}
.layout{display:flex;}
.sidebar{width:260px;background:#000;height:100vh;position:fixed;left:0;top:0;padding:20px 10px;}
.sidebar img{width:180px;display:block;margin:0 auto 30px auto;}
.menu-item{display:block;padding:15px;margin:5px 0;text-decoration:none;color:#fff;font-size:18px;border-radius:8px;}
.menu-item:hover,.menu-item:focus{background:#e50914;outline:none;}
.main{margin-left:260px;width:calc(100% - 260px);}

/* ===== POSTERS ===== */
.poster{padding:0 40px;}
.poster h4{font-size:26px;margin-bottom:15px;position:relative;display:inline-block;}
.poster h4::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-6px;
  width:60%;
  height:4px;
  background:#e50914;
  border-radius:4px;
}

/* ===== SCROLL MENU ===== */
.scrollmenu{
  display:flex;
  gap:18px;
  padding:20px 40px;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-behavior:smooth;
}
.scrollmenu::-webkit-scrollbar{display:none;}

/* ===== CARDS ===== */
.card-link{flex:0 0 auto;text-decoration:none;color:white;outline:none;}
.xplus{width:180px;position:relative;transition:transform .3s;}
.xaviec{
  width:100%;
  height:260px;
  object-fit:cover;
  border-radius:12px;
  border:3px solid transparent;
  transition:.3s;
}
.xplus i{
  display:block;
  margin-top:8px;
  text-align:center;
  font-size:16px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.card-link:focus .xaviec,
.card-link:hover .xaviec{
  border:3px solid #00eaff;
  box-shadow:0 0 12px rgba(0,234,255,0.6);
  transform:scale(1.05);
}

/* Candado */
.lock-icon{
  position:absolute;
  top:8px;
  right:8px;
  font-size:26px;
  display:none;
  animation:floatLock 2s ease-in-out infinite;
}
.card-link.locked .lock-icon{display:block;}
@keyframes floatLock{
  0%{transform:translateY(0)}
  50%{transform:translateY(-5px)}
  100%{transform:translateY(0)}
}

/* ===== RESPONSIVE ===== */
@media(min-width:1400px){
  .xplus{width:220px;}
  .xaviec{height:320px;}
}
@media(min-width:1900px){
  .xplus{width:260px;}
  .xaviec{height:380px;}
}
</style>
</head>

<body>

<div class="layout">

<div class="sidebar">
<img src="Logo MovieTx.png" alt="Logo">
<a href="#" class="menu-item">Inicio</a>
<a href="#" class="menu-item">Peliculas</a>
<a href="#" class="menu-item">Series</a>
</div>

<div class="main">

<div class="poster">
<h4>Series</h4>
</div>

<div class="scrollmenu">

<a class="card-link" data-href="">
<div class="xplus">
<img class="xaviec" src="https://image.tmdb.org/t/p/w300/vQANo4LO7Hi57XxQqhRWeAZkD5h.jpg">
<i>En el barro</i>
<span class="lock-icon">🔒</span>
</div>
</a>

<a class="card-link" data-href="View Series/En el barro (2025).html">
<div class="xplus">
<img class="xaviec" src="https://image.tmdb.org/t/p/w300/vQANo4LO7Hi57XxQqhRWeAZkD5h.jpg">
<i>En el barro</i>
<span class="lock-icon">🔒</span>
</div>
</a>

</div>

</div>
</div>

<script>
function actualizarCandados(){
document.querySelectorAll('.card-link').forEach(link=>{
const href=link.getAttribute('data-href');
if(!href||href.trim()===""){
link.classList.add("locked");
link.setAttribute("href","#");
link.style.pointerEvents="none";
link.style.opacity="0.6";
}else{
link.classList.remove("locked");
link.setAttribute("href",href);
link.style.pointerEvents="auto";
link.style.opacity="1";
}
});
}

function activarNavegacion(){
const cards=document.querySelectorAll('.card-link');
cards.forEach(card=>{
card.setAttribute("tabindex","0");
card.addEventListener("focus",()=>{
card.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
});
});

document.addEventListener("keydown",e=>{
const active=document.activeElement;
if(!active.classList.contains("card-link"))return;

if(e.key==="ArrowRight"){
e.preventDefault();
active.nextElementSibling?.focus();
}
if(e.key==="ArrowLeft"){
e.preventDefault();
active.previousElementSibling?.focus();
}
});
}

document.addEventListener("DOMContentLoaded",()=>{
actualizarCandados();
activarNavegacion();
});
</script>

</body>
</html>
